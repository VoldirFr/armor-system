# Memory settings for Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.265
neo_version_range=[21.1.0,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=armorsystem
# The human-readable display name for the mod.
mod_name=Armor System
# The license of the mod.
mod_license=All Rights Reserved
# The mod version.
mod_version=1.0.8
# The group ID for the mod. This should match the base package used for the mod sources.
mod_group_id=fr.voldir.armorsystem
mod_authors=VoldirFr
mod_description=Systeme automatique d'armures: 27 sets (9 paliers de poids x 3 sous-classes), teints via la couleur hex de l'ingot source, bonus de set via Iron's Spells 'n Spellbooks.

## Dependencies (Modrinth maven)
irons_spellbooks_version=1.21.1-3.16.4
irons_lib_version=1.21.1-2.4.0
geckolib_version=1.21.1-4.8.2
curios_version=9.5.1+1.21.1
playeranimator_version=2.0.1+1.21.1-forge
